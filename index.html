<!DOCTYPE html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Technology System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #e8e8e8;
      font-family: "Aptos", system-ui, -apple-system, sans-serif;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #f6c6ad;
      text-decoration: underline;
      letter-spacing: 0.5px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .item-card img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .item-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .title-link {
      font-size: 1.55rem;
      color: #e8e8e8;
      text-decoration: underline;
      font-weight: 600;
    }

    .admin-link {
      font-size: 1.35rem;
      color: #2e9e3f;
      text-decoration: underline;
      font-weight: 500;
    }

    .title-link:hover,
    .admin-link:hover {
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>RP Technology System</h1>

    <div class="item-list">
      <article class="item-card">
        <img src="Logo.jpeg" alt="Kolam Sungkai Logo">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/Dashboard/Sungkai.html">Kolam Sungkai</a>
          <a class="admin-link" href="https://ultiga.github.io/Dashboard/Dashboard.html">Dashboard Admin Page</a>
        </div>
      </article>

      <article class="item-card">
        <img src="Langkap.png" alt="Kolam Langkap Logo">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/Dashboard/Sungkai.html">Kolam Langkap</a>
          <a class="admin-link" href="https://ultiga.github.io/Dashboard/Dashboard.html">Dashboard Admin Page</a>
        </div>
      </article>

      <article class="item-card">
        <img src="NHMEGA.png" alt="Kolam NHMEGA Logo">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/Dashboard/Sungkai.html">Kolam NHMEGA</a>
          <a class="admin-link" href="https://ultiga.github.io/Dashboard/Dashboard.html">Dashboard Admin Page</a>
        </div>
      </article>

      <article class="item-card">
        <img src="Kampar.jpg" alt="Kolam Kampar Logo">
        <div class="item-content">
          <a class="title-link" href="https://ultiga.github.io/Dashboard/Sungkai.html">Kolam Kampar</a>
          <a class="admin-link" href="https://ultiga.github.io/Dashboard/Dashboard.html">Dashboard Admin Page</a>
        </div>
      </article>
    </div>
  </main>

</body>
</html>
